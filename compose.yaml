services:
  postgres:
    image: postgres:16-alpine
    container_name: libreria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: libreria
      POSTGRES_PASSWORD: libreriasecret2026
      POSTGRES_DB: libreria_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libreria -d libreria_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: libreria-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://libreria:libreriasecret2026@postgres:5432/libreria_db
      SQL_ECHO: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: libreria-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_UPSTREAM: backend:8000
    ports:
      - "8080:80"

volumes:
  pgdata:
